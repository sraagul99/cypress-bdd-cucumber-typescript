name: Sri Lanka QA Job Hunter

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sri-lanka-qa-job-hunter
  cancel-in-progress: false

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: job-hunter/requirements.txt

      - name: Install dependencies
        run: pip install -r job-hunter/requirements.txt

      - name: Search public results and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job-hunter/job_hunter.py

      - name: Save de-duplication state
        run: |
          if [[ -n "$(git status --porcelain job-hunter/seen_jobs.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add job-hunter/seen_jobs.json
            git commit -m "Update QA job hunter search history"
            git push
          fi
